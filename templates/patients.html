<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-0">Patients</h1>
            <p class="text-muted mb-0">
                Neonatal Electronic Health Record System
            </p>
        </div>

        <a href="/new-patient" class="btn btn-primary">
            + New Patient
        </a>

    </div>

    <!-- Search -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <label class="form-label">
                Search Patient
            </label>

            <input
                type="text"
                class="form-control"
                placeholder="Search by patient name..."
            >

        </div>

    </div>

    <!-- Patient List -->

    <div class="row">

        <!-- Patient Card -->

        <div class="col-md-6 mb-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Emma Gonzalez
                    </h5>

                    <p class="text-muted">
                        Female • 39 weeks
                    </p>

                    <hr>

                    <p>
                        <strong>Birth Date:</strong>
                        12 May 2026
                    </p>

                    <p>
                        <strong>Birth Weight:</strong>
                        3200 g
                    </p>

                    <p>
                        <strong>Status:</strong>
                        Active
                    </p>

                    <a
                        href="/patient/1"
                        class="btn btn-outline-primary"
                    >
                        View Record
                    </a>

                </div>

            </div>

        </div>

        <!-- Patient Card -->

        <div class="col-md-6 mb-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Noah Silva
                    </h5>

                    <p class="text-muted">
                        Male • 35 weeks
                    </p>

                    <hr>

                    <p>
                        <strong>Birth Date:</strong>
                        10 May 2026
                    </p>

                    <p>
                        <strong>Birth Weight:</strong>
                        2450 g
                    </p>

                    <p>
                        <strong>Status:</strong>
                        Active
                    </p>

                    <a
                        href="/patient/2"
                        class="btn btn-outline-primary"
                    >
                        View Record
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
