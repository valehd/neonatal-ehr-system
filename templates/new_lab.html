{% extends "base.html" %}

{% block title %}New Laboratory Result{% endblock %}

{% block content %}

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">
                Add Laboratory Result
            </h4>

            <a href="/patient/{{ patient.patient_id }}"
           class="btn btn-outline-secondary">
            Back to Patient
        </a>
            
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Exam Date
                        </label>

                        <input
                            type="date"
                            name="exam_date"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label">
                            Laboratory Test
                        </label>

                        <input
                            type="text"
                            name="exam_name"
                            class="form-control"
                            required
                        >
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Result
                        </label>

                        <input
                            type="text"
                            name="result"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Unit
                        </label>

                        <input
                            type="text"
                            name="unit"
                            class="form-control"
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Reference Range
                        </label>

                        <input
                            type="text"
                            name="reference_range"
                            class="form-control"
                        >
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Observations
                    </label>

                    <textarea
                        name="observations"
                        rows="3"
                        class="form-control"
                    ></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Laboratory Result
                </button>

            </form>

        </div>

    </div>
    {% endblock %}
