<div class="card shadow-sm mb-4">

    <div class="card-header">
        <h5 class="mb-0">
            Birth Measurements
        </h5>
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-3">
                <strong>Birth Weight</strong>
                <p>{{ patient.birth_weight }} g</p>
            </div>

            <div class="col-md-3">
                <strong>Birth Length</strong>
                <p>{{ patient.birth_length }} cm</p>
            </div>

            <div class="col-md-3">
                <strong>Head Circumference</strong>
                <p>{{ patient.head_circumference }} cm</p>
            </div>

            <div class="col-md-3">
                <strong>Growth Percentile</strong>
                <p>{{ patient.growth_percentile }}</p>
            </div>

        </div>

    </div>

</div>
