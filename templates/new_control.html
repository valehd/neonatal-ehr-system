{% extends "base.html" %}

{% block title %}New Neonatal Control{% endblock %}

{% block content %}

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>New Neonatal Control</h1>
            <p class="text-muted mb-0">
                {{ patient.first_name }} {{ patient.last_name }}
            </p>
        </div>

        <a href="/patient/{{ patient.patient_id }}"
           class="btn btn-outline-secondary">
            Back to Patient
        </a>

    </div>

    <form method="POST">

        <!-- Control Information -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Control Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Control Date</label>
                        <input type="date"
                               name="control_date"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Control Time</label>
                        <input type="time"
                               name="control_time"
                               class="form-control"
                               required>
                    </div>

                </div>

            </div>

        </div>

        <!-- Vital Signs -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Vital Signs</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2 mb-3">
                        <label>Weight (g)</label>
                        <input type="number"
                               name="weight"
                               class="form-control">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Temperature</label>
                        <input type="number"
                               step="0.1"
                               name="temperature"
                               class="form-control">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Heart Rate</label>
                        <input type="number"
                               name="heart_rate"
                               class="form-control">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Respiratory Rate</label>
                        <input type="number"
                               name="respiratory_rate"
                               class="form-control">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Blood Pressure</label>
                        <input type="text"
                               name="blood_pressure"
                               class="form-control"
                               placeholder="65/40">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Sat O₂ (%)</label>
                        <input type="number"
                               name="oxygen_saturation"
                               class="form-control">
                    </div>

                </div>

            </div>

        </div>

        <!-- Feeding -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Feeding</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Feeding Type</label>
                        <select name="feeding_type"
                                class="form-select">

                            <option>Breastfeeding</option>
                            <option>Formula</option>
                            <option>Mixed Feeding</option>
                            <option>NPO</option>
                            <option>Parenteral Nutrition</option>

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Feeding Route</label>
                        <select name="feeding_route"
                                class="form-select">

                            <option>Oral</option>
                            <option>Tube Feeding</option>
                            <option>Oral + Tube</option>

                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- Clinical Assessment -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Clinical Status</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>General Condition</label>
                        <select name="general_condition"
                                class="form-select">

                            <option>Good</option>
                            <option>Fair</option>
                            <option>Critical</option>

                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Muscle Tone</label>
                        <select name="muscle_tone"
                                class="form-select">

                            <option>Normal</option>
                            <option>Hypotonic</option>
                            <option>Hypertonic</option>

                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Skin Condition</label>
                        <select name="skin_condition"
                                class="form-select">

                            <option>Normal</option>
                            <option>Jaundiced</option>
                            <option>Pale</option>
                            <option>Cyanotic</option>

                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- Nursing Care -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Nursing Care</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label>Bed Type</label>
                        <select name="bed_type"
                                class="form-select">

                            <option>Incubator</option>
                            <option>Radiant Warmer</option>
                            <option>Crib</option>

                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Incubator Temp</label>
                        <input type="number"
                               step="0.1"
                               name="incubator_temperature"
                               class="form-control">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>O₂ Support</label>
                        <select name="oxygen_support"
                                class="form-select">

                            <option value="0">No</option>
                            <option value="1">Yes</option>

                        </select>
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Position Changed</label>
                        <select name="position_changed"
                                class="form-select">

                            <option value="0">No</option>
                            <option value="1">Yes</option>

                        </select>
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Morning Hygiene</label>
                        <select name="morning_hygiene"
                                class="form-select">

                            <option value="0">No</option>
                            <option value="1">Yes</option>

                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- Notes -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Observations</h5>
            </div>

            <div class="card-body">

                <textarea
                    name="observations"
                    rows="5"
                    class="form-control"
                    placeholder="Clinical observations..."
                ></textarea>

            </div>

        </div>

        <button type="submit"
                class="btn btn-primary btn-lg">
            Save Control
        </button>

    </form>

{% endblock %}
