{% extends "base.html" %} {% block title %}New Diagnosis{% endblock %} {% block
content %}

<div class="card shadow-sm">
  <div class="card-header">
    <h4 class="mb-0">Add Diagnosis</h4>
  </div>

  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label"> Diagnosis </label>

        <input
          type="text"
          class="form-control"
          name="diagnosis_name"
          required
        />
      </div>

      <div class="row">
        <div class="col-md-4">
          <label class="form-label"> ICD-10 Code </label>

          <input type="text" class="form-control" name="icd10_code" />
        </div>

        <div class="col-md-4">
          <label class="form-label"> Diagnosis Date </label>

          <input
            type="date"
            class="form-control"
            name="diagnosis_date"
            required
          />
        </div>

        <div class="col-md-4">
          <label class="form-label"> Status </label>

          <select class="form-select" name="status">
            <option value="Active">Active</option>

            <option value="Resolved">Resolved</option>

            <option value="Suspected">Suspected</option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <label class="form-label"> Notes </label>

        <textarea class="form-control" rows="4" name="observations"></textarea>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Save Diagnosis</button>

        <a href="/patient/{{ patient.patient_id }}" class="btn btn-secondary">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
