<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Header Section (Idéntico a tu formato estándar) -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>New Neonatal Record</h1>
            <p class="text-muted mb-0">
                Create a new neonatal medical record
            </p>
        </div>

        <a href="/"
           class="btn btn-outline-secondary">
            Back to Patients
        </a>

    </div>

    <form method="POST">

        <!-- General Information Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">General Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Sex</label>
                        <select name="sex" class="form-select">
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- Birth Information Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Birth Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="date_of_birth" class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Time of Birth</label>
                        <input type="time" name="time_of_birth" class="form-control">       
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Gestational Age (weeks)</label>
                        <input type="number" name="gestational_age" class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Delivery Type</label>
                        <select name="delivery_type" class="form-select">
                            <option>Vaginal</option>
                            <option>Cesarean</option>
                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- Anthropometric Data Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Anthropometric Data</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Birth Weight (g)</label>
                        <input type="number" name="birth_weight" class="form-control">
                    </div>  

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Birth Length (cm)</label>
                        <input type="number" name="birth_length" class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Head Circumference (cm)</label>
                        <input type="number" name="head_circumference" class="form-control">
                    </div>

                    <div class="col-md-3 mb-3"> 
                        <label class="form-label">Growth Percentile</label>
                        <input type="number" name="growth_percentile" class="form-control">
                    </div>

                </div>

            </div>

        </div>

        <!-- Neonatal Adaptations Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Neonatal Adaptations</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">APGAR 1 min Score</label>
                        <input type="text" name="apgar_1_min" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">APGAR 5 min Score</label>
                        <input type="text" name="apgar_5_min" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Resuscitation Required</label>
                        <select name="resuscitation_required" class="form-select">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- Administrative Information Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Administrative Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Medical Record Number</label>
                        <input type="text" name="medical_record_number" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">National ID</label>
                        <input type="text" name="national_id" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Health Insurance</label>
                        <input type="text" name="health_insurance" class="form-control">
                    </div>

                </div>

            </div>

        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-end mb-4">
            <button type="submit" class="btn btn-primary px-5">
                Save Patient
            </button>
        </div>

    </form>

</div>

</body>
</html>
