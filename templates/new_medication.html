<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Medication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Botón superior para volver -->
                <div class="mb-4">
                    <a href="/patient/{{ patient.patient_id }}" class="btn btn-outline-secondary btn-sm">
                        ← Back to Patient
                    </a>
                </div>

                <!-- Tarjeta del Formulario -->
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-1">Register Medication</h4>
                        <p class="mb-0 small text-white-50">
                            Patient: <strong>{{ patient.first_name }} {{ patient.last_name }}</strong>
                        </p>
                    </div>
                    
                    <div class="card-body p-4">
                        <form method="POST">

                            <!-- Medication Name -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Medication Name</label>
                                <input type="text" name="medication_name" class="form-control" required placeholder="e.g., Ampicillin">
                            </div>

                            <!-- Row para Dose y Route -->
                            <div class="row">
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label fw-bold">Dose</label>
                                    <input type="text" name="dose" class="form-control" placeholder="e.g., 100 mg" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label fw-bold">Route</label>
                                    <select name="route" class="form-select" required>
                                        <option value="">Select...</option>
                                        <option value="IV">IV (Intravenous)</option>
                                        <option value="IM">IM (Intramuscular)</option>
                                        <option value="VO">Oral</option>
                                        <option value="SC">SC (Subcutaneous)</option>
                                        <option value="NG">NGS (Nasogastric Tube)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Frequency -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Frequency</label>
                                <input type="text" name="frequency" class="form-control" placeholder="e.g., Every 12 hours" required>
                            </div>

                            <!-- Row para Fechas -->
                            <div class="row">
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label fw-bold">Start Date</label>
                                    <input type="date" name="start_date" class="form-control" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label fw-bold">End Date</label>
                                    <input type="date" name="end_date" class="form-control">
                                </div>
                            </div>

                            <!-- Observations -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Observations</label>
                                <textarea name="observations" class="form-control" rows="3" placeholder="Additional clinical notes..."></textarea>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Save Medication
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
