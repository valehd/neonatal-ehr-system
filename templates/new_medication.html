
{% extends "base.html" %}

{% block title %}Register Medication{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Register Medication</h1>
            <p class="text-muted mb-0">
                Patient: {{ patient.first_name }} {{ patient.last_name }}
            </p>
        </div>

        <a href="/patient/{{ patient.patient_id }}"
           class="btn btn-outline-secondary">
            Back to Patient
        </a>

    </div>

    <form method="POST">

        <!-- Prescription Details Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Prescription Details</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Medication Name</label>
                        <input type="text" 
                               name="medication_name" 
                               class="form-control" 
                               required 
                               placeholder="e.g., Ampicillin">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Dose</label>
                        <input type="text" 
                               name="dose" 
                               class="form-control" 
                               placeholder="e.g., 100 mg" 
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Route</label>
                        <select name="route" 
                                class="form-select" 
                                required>
                            <option value="">Select...</option>
                            <option value="IV">IV (Intravenous)</option>
                            <option value="IM">IM (Intramuscular)</option>
                            <option value="VO">Oral</option>
                            <option value="SC">SC (Subcutaneous)</option>
                            <option value="NG">NGS (Nasogastric Tube)</option>
                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- Schedule Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Schedule & Duration</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Frequency</label>
                        <input type="text" 
                               name="frequency" 
                               class="form-control" 
                               placeholder="e.g., Every 12 hours" 
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" 
                               name="start_date" 
                               class="form-control" 
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">End Date</label>
                        <input type="date" 
                               name="end_date" 
                               class="form-control">
                    </div>

                </div>

            </div>

        </div>

        <!-- Observations Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Observations</h5>
            </div>

            <div class="card-body">

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Notes / Comments</label>
                        <textarea name="observations" 
                    class="form-control" 
                    rows="3"  
                    placeholder="Additional clinical notes..."></textarea>
                    </div>
                </div>

            </div>

        </div>

        <!-- Action Buttons (Alineado a la derecha como tu estándar) -->
        <div class="d-flex justify-content-end mb-4">
            <button type="submit" class="btn btn-primary px-5">
                Save Medication
            </button>
        </div>

    </form>


{% endblock %}
